openapi: 3.1.0
info:
  title: Student Exam Preparation API
  version: 1.0.0
  description: Canonical contract for student study plans. The API is unauthenticated for the single-user v1 workspace.
servers:
  - url: /api
tags:
  - name: Study plans
    description: Create, find, update, and archive exam preparation plans.
paths:
  /tasks:
    get:
      operationId: listTasks
      tags: [Study plans]
      summary: List active study plans
      description: Returns active study plans ordered by study date ascending, target date ascending, creation time descending, then identifier ascending. Missing dates sort before dated plans. Supports filtering by subject, status, priority, date, or keyword.
      parameters:
        - name: status
          in: query
          description: Filter by lifecycle status.
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          description: Filter by priority.
          schema:
            $ref: '#/components/schemas/TaskPriority'
        - name: subject
          in: query
          description: Case-insensitive exact subject filter.
          schema:
            type: string
            maxLength: 100
        - name: search
          in: query
          description: Case-insensitive substring search across subject, title, topics, and important notes.
          schema:
            type: string
            maxLength: 2000
        - name: dueBefore
          in: query
          description: Return study plans with an exam or completion target on or before this date.
          schema:
            type: string
            format: date
        - name: dueAfter
          in: query
          description: Return study plans with an exam or completion target on or after this date.
          schema:
            type: string
            format: date
        - name: studyAfter
          in: query
          description: Return study plans scheduled on or after this date.
          schema:
            type: string
            format: date
        - name: studyBefore
          in: query
          description: Return study plans scheduled on or before this date.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Active study plan list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTask
      tags: [Study plans]
      summary: Create a study plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Study plan created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTask
      tags: [Study plans]
      summary: Get a study plan
      responses:
        '200':
          description: Study plan details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateTask
      tags: [Study plans]
      summary: Replace editable study plan fields
      description: All editable fields are required. The study plan identifier and creation timestamp are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskReplacement'
      responses:
        '200':
          description: Study plan updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: archiveTask
      tags: [Study plans]
      summary: Archive a study plan
      description: Archives the study plan for audit purposes; archived plans are excluded from active reads and lists.
      responses:
        '204':
          description: Study plan archived.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}/status:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      operationId: updateTaskStatus
      tags: [Study plans]
      summary: Update study plan status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: Study plan status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Study plan identifier.
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
  schemas:
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed]
    TaskPriority:
      type: string
      enum: [low, medium, high]
    TaskInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 100
          default: General
          description: Student's subject. Defaults to General for existing API clients.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Must not be blank after trimming.
        description:
          type: string
          maxLength: 2000
          description: Topics, chapters, or study materials to cover.
        importantNotes:
          type: string
          maxLength: 2000
          description: Important reminders or notes for this study plan.
        status:
          $ref: '#/components/schemas/TaskStatus'
          default: pending
        priority:
          $ref: '#/components/schemas/TaskPriority'
          default: medium
        dueDate:
          type: string
          format: date
          description: ISO calendar date for the exam or target completion date.
        studyDate:
          type: [string, 'null']
          format: date
          description: ISO calendar date when the student plans to study.
    Task:
      type: object
      additionalProperties: false
      required: [id, subject, title, description, importantNotes, status, priority, dueDate, studyDate, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        subject:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        importantNotes:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
        studyDate:
          type: [string, 'null']
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskReplacement:
      type: object
      additionalProperties: false
      required: [subject, title, description, importantNotes, status, priority, dueDate, studyDate]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Must not be blank after trimming.
        description:
          type: string
          maxLength: 2000
        importantNotes:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
          description: ISO 8601 calendar date or null to clear the due date.
        studyDate:
          type: [string, 'null']
          format: date
          description: ISO calendar date or null to clear the scheduled study date.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
  responses:
    ValidationError:
      description: Invalid request data or study plan identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Study plan does not exist or is not active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
